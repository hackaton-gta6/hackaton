name: CI

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install refreshes the lockfile while Astro is being introduced.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
